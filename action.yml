name: 'Quality Gate'
description: 'Automated multi-gate code quality orchestrator for .NET 10 applications (Build, Test, Coverage, Complexity, Static Analysis, Architecture, and Mutation).'
author: 'Walisson Pires'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  version:
    description: 'Version of Quality Gate CLI to download (e.g. latest, 1.0.4, v1.0.4).'
    required: false
    default: 'latest'
  command:
    description: "Execution mode: 'check' (evaluate gates), 'baseline-record' (record current metrics to baseline), or 'setup' (install CLI only)."
    required: false
    default: 'check'
  diff:
    description: 'Evaluate only changed code against git base reference.'
    required: false
    default: 'true'
  working-tree:
    description: 'Include uncommitted local changes (staged, unstaged, untracked).'
    required: false
    default: 'false'
  repository:
    description: 'Evaluate the entire repository.'
    required: false
    default: 'false'
  project:
    description: 'Path to a specific .csproj project.'
    required: false
    default: ''
  namespace:
    description: 'Specific C# namespace to evaluate.'
    required: false
    default: ''
  base:
    description: "Git base reference for diff comparison (e.g. 'origin/main', 'HEAD~1')."
    required: false
    default: ''
  ratchet:
    description: 'Enable ratchet mode against baseline to prevent quality regression.'
    required: false
    default: 'false'
  baseline-path:
    description: 'Explicit path to baseline JSON file.'
    required: false
    default: ''
  auto-extract-baseline:
    description: 'When ratchet is true and baseline-path is empty, auto-extract .qualitygate/baseline.json from git target branch.'
    required: false
    default: 'true'
  baseline-branch:
    description: "Branch or ref to extract baseline from. If empty, falls back to github.base_ref then 'origin/main'."
    required: false
    default: ''
  format:
    description: "Output format ('both', 'console', 'markdown', 'json')."
    required: false
    default: 'both'
  skip:
    description: 'Comma-separated gates to skip.'
    required: false
    default: ''
  only:
    description: 'Comma-separated gates to run exclusively.'
    required: false
    default: ''
  fail-fast:
    description: 'Stop execution on first gate failure.'
    required: false
    default: 'false'
  verbose:
    description: 'Enable detailed diagnostic output.'
    required: false
    default: 'false'
  config:
    description: 'Path to configuration file.'
    required: false
    default: 'qualitygate.json'
  summary:
    description: 'Publish Markdown report to GITHUB_STEP_SUMMARY.'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for release downloads.'
    required: false
    default: ${{ github.token }}
  repo:
    description: 'GitHub repository hosting releases.'
    required: false
    default: 'WalissonPires/quality-gate-dotnet'
  qualitygate-path:
    description: 'Path to an existing executable, skipping download.'
    required: false
    default: ''
  install-dir:
    description: 'Path to install downloaded binary.'
    required: false
    default: ${{ runner.temp }}/qualitygate-bin
  additional-args:
    description: 'Extra CLI arguments passed to qualitygate.'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'CLI exit code (0=Success, 1=QualityFailure, 2=ConfigurationError, 3=InfrastructureError, 4=ScopeError, 5=InternalError).'
    value: ${{ steps.run-gate.outputs.exit-code }}
  passed:
    description: "Boolean string ('true' or 'false') indicating gate pass/fail status."
    value: ${{ steps.run-gate.outputs.passed }}
  run-id:
    description: 'Unique execution GUID generated by the CLI.'
    value: ${{ steps.run-gate.outputs.run-id }}
  artifacts-dir:
    description: 'Path to .qualitygate/artifacts/<runId>.'
    value: ${{ steps.run-gate.outputs.artifacts-dir }}
  report-json:
    description: 'Path to generated report.json.'
    value: ${{ steps.run-gate.outputs.report-json }}
  report-md:
    description: 'Path to generated report.md.'
    value: ${{ steps.run-gate.outputs.report-md }}
  cli-version:
    description: 'Installed or executed CLI version string.'
    value: ${{ steps.setup-cli.outputs.cli-version }}

runs:
  using: 'composite'
  steps:
    - id: setup-cli
      shell: bash
      env:
        INPUT_QUALITYGATE_PATH: ${{ inputs.qualitygate-path }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        if [ -n "$INPUT_QUALITYGATE_PATH" ]; then
          if [ ! -f "$INPUT_QUALITYGATE_PATH" ]; then
            echo "::error::Specified qualitygate-path '$INPUT_QUALITYGATE_PATH' does not exist."
            exit 1
          fi

          if [[ "$INPUT_QUALITYGATE_PATH" = /* ]] || [[ "$INPUT_QUALITYGATE_PATH" =~ ^[A-Za-z]: ]]; then
            CLI_PATH="$INPUT_QUALITYGATE_PATH"
          else
            CLI_PATH="$(pwd)/$INPUT_QUALITYGATE_PATH"
          fi
          INSTALL_DIR="$(dirname "$CLI_PATH")"
        else
          OS_NAME="$(echo "${RUNNER_OS:-Linux}" | tr '[:upper:]' '[:lower:]')"
          ARCH_NAME="$(echo "${RUNNER_ARCH:-X64}" | tr '[:upper:]' '[:lower:]')"
          INSTALL_DIR="$INPUT_INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"

          case "$OS_NAME" in
            linux)
              case "$ARCH_NAME" in
                x64)
                  RID="linux-x64"
                  EXT="tar.gz"
                  BIN="qualitygate"
                  ;;
                arm64)
                  RID="linux-arm64"
                  EXT="tar.gz"
                  BIN="qualitygate"
                  ;;
                *)
                  echo "::error::Unsupported Linux architecture: $ARCH_NAME"
                  exit 1
                  ;;
              esac
              ;;
            windows)
              case "$ARCH_NAME" in
                x64)
                  RID="win-x64"
                  EXT="zip"
                  BIN="qualitygate.exe"
                  ;;
                *)
                  echo "::error::Unsupported Windows architecture: $ARCH_NAME"
                  exit 1
                  ;;
              esac
              ;;
            macos|darwin)
              case "$ARCH_NAME" in
                x64)
                  RID="osx-x64"
                  EXT="tar.gz"
                  BIN="qualitygate"
                  ;;
                arm64)
                  RID="osx-arm64"
                  EXT="tar.gz"
                  BIN="qualitygate"
                  ;;
                *)
                  echo "::error::Unsupported macOS architecture: $ARCH_NAME"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Unsupported OS: $OS_NAME"
              exit 1
              ;;
          esac

          CLI_PATH="$INSTALL_DIR/$BIN"

          if [ ! -f "$CLI_PATH" ]; then
            echo "Downloading Quality Gate CLI ($RID)..."
            VERSION="$INPUT_VERSION"
            ARCHIVE_PATTERN="*${RID}.${EXT}"

            DOWNLOADED=false
            if command -v gh >/dev/null 2>&1; then
              echo "Using GitHub CLI (gh) to download release..."
              if [ "$VERSION" = "latest" ]; then
                if gh release download --repo "$INPUT_REPO" --pattern "$ARCHIVE_PATTERN" --dir "$INSTALL_DIR"; then
                  DOWNLOADED=true
                fi
              else
                TAG_ARG="$VERSION"
                [[ "$TAG_ARG" != v* ]] && TAG_ARG="v${TAG_ARG}"
                if gh release download "$TAG_ARG" --repo "$INPUT_REPO" --pattern "$ARCHIVE_PATTERN" --dir "$INSTALL_DIR"; then
                  DOWNLOADED=true
                fi
              fi
            fi

            if [ "$DOWNLOADED" = "false" ]; then
              echo "Using curl to download release..."
              if [ "$VERSION" = "latest" ]; then
                API_URL="https://api.github.com/repos/${INPUT_REPO}/releases/latest"
              else
                TAG_ARG="$VERSION"
                [[ "$TAG_ARG" != v* ]] && TAG_ARG="v${TAG_ARG}"
                API_URL="https://api.github.com/repos/${INPUT_REPO}/releases/tags/${TAG_ARG}"
              fi

              AUTH_HEADER=()
              if [ -n "$GH_TOKEN" ]; then
                AUTH_HEADER=(-H "Authorization: Bearer $GH_TOKEN")
              fi

              RELEASE_JSON="$(curl -sSL "${AUTH_HEADER[@]}" -H "Accept: application/vnd.github+json" "$API_URL")"
              DOWNLOAD_URL="$(echo "$RELEASE_JSON" | grep -o "https://[^\"]*${RID}\.${EXT}" | head -n 1 || true)"

              if [ -z "$DOWNLOAD_URL" ]; then
                echo "::error::Failed to find download URL for RID '$RID' in release response from $API_URL"
                echo "Response preview: $(echo "$RELEASE_JSON" | head -n 20)"
                exit 1
              fi

              ARCHIVE_NAME="$(basename "$DOWNLOAD_URL")"
              curl -sSL "${AUTH_HEADER[@]}" -o "$INSTALL_DIR/$ARCHIVE_NAME" "$DOWNLOAD_URL"
            fi

            ARCHIVE_FILE="$(ls -1 "$INSTALL_DIR"/*"${RID}.${EXT}" 2>/dev/null | head -n 1 || true)"
            if [ -z "$ARCHIVE_FILE" ] || [ ! -f "$ARCHIVE_FILE" ]; then
              echo "::error::Archive file matching *${RID}.${EXT} not found in $INSTALL_DIR."
              exit 1
            fi

            echo "Extracting $ARCHIVE_FILE..."
            if [ "$EXT" = "tar.gz" ]; then
              tar -xzf "$ARCHIVE_FILE" -C "$INSTALL_DIR"
            else
              if command -v unzip >/dev/null 2>&1; then
                unzip -o -q "$ARCHIVE_FILE" -d "$INSTALL_DIR"
              else
                tar -xf "$ARCHIVE_FILE" -C "$INSTALL_DIR"
              fi
            fi

            rm -f "$ARCHIVE_FILE"
          fi

          chmod +x "$CLI_PATH" 2>/dev/null || true
        fi

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        CLI_VERSION="$("$CLI_PATH" version 2>/dev/null || echo "")"
        echo "Installed Quality Gate CLI: $CLI_VERSION at $CLI_PATH"
        echo "cli-path=$CLI_PATH" >> "$GITHUB_OUTPUT"
        echo "cli-version=$CLI_VERSION" >> "$GITHUB_OUTPUT"

    - id: prepare-baseline
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_RATCHET: ${{ inputs.ratchet }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
        INPUT_AUTO_EXTRACT_BASELINE: ${{ inputs.auto-extract-baseline }}
        INPUT_BASELINE_BRANCH: ${{ inputs.baseline-branch }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$INPUT_COMMAND" != "check" ] || [ "$INPUT_RATCHET" != "true" ]; then
          exit 0
        fi
        RESOLVED=""

        if [ "$INPUT_AUTO_EXTRACT_BASELINE" = "true" ]; then
          CANDIDATES=()
          if [ -n "$INPUT_BASELINE_BRANCH" ]; then
            CANDIDATES+=("$INPUT_BASELINE_BRANCH" "origin/$INPUT_BASELINE_BRANCH")
          fi
          if [ -n "$GITHUB_BASE_REF" ]; then
            CANDIDATES+=("origin/$GITHUB_BASE_REF" "$GITHUB_BASE_REF")
          fi
          CANDIDATES+=("origin/main" "origin/master" "main" "master")

          PATH_CANDIDATES=()
          if [ -n "$INPUT_BASELINE_PATH" ]; then
            PATH_CANDIDATES+=("$INPUT_BASELINE_PATH")
          fi
          PATH_CANDIDATES+=(".qualitygate/baseline.json" ".tools/quality-gate/baseline.json")

          FOUND_REF=""
          FOUND_PATH=""
          for REF in "${CANDIDATES[@]}"; do
            if [ -n "$REF" ] && git rev-parse --verify "$REF" >/dev/null 2>&1; then
              for BPATH in "${PATH_CANDIDATES[@]}"; do
                if git cat-file -e "$REF:$BPATH" 2>/dev/null; then
                  FOUND_REF="$REF"
                  FOUND_PATH="$BPATH"
                  break 2
                fi
              done
            fi
          done

          if [ -n "$FOUND_REF" ] && [ -n "$FOUND_PATH" ]; then
            TEMP_DIR="${RUNNER_TEMP:-/tmp}/qualitygate-ratchet"
            mkdir -p "$TEMP_DIR"
            TARGET_FILE="$TEMP_DIR/baseline.json"
            if git show "$FOUND_REF:$FOUND_PATH" > "$TARGET_FILE" 2>/dev/null && [ -s "$TARGET_FILE" ]; then
              RESOLVED="$TARGET_FILE"
              echo "resolved-baseline=$TARGET_FILE" >> "$GITHUB_OUTPUT"
              echo "Successfully extracted baseline ($FOUND_PATH) from $FOUND_REF to $TARGET_FILE"
            fi
          fi
        fi

        if [ -z "$RESOLVED" ]; then
          if [ -n "$INPUT_BASELINE_PATH" ] && [ -f "$INPUT_BASELINE_PATH" ]; then
            echo "resolved-baseline=$INPUT_BASELINE_PATH" >> "$GITHUB_OUTPUT"
            echo "Using local baseline file: $INPUT_BASELINE_PATH"
          elif [ -f ".qualitygate/baseline.json" ]; then
            echo "resolved-baseline=.qualitygate/baseline.json" >> "$GITHUB_OUTPUT"
            echo "Using local baseline file: .qualitygate/baseline.json"
          elif [ -f ".tools/quality-gate/baseline.json" ]; then
            echo "resolved-baseline=.tools/quality-gate/baseline.json" >> "$GITHUB_OUTPUT"
            echo "Using local baseline file: .tools/quality-gate/baseline.json"
          else
            echo "Notice: Baseline file not found on target ref or locally. Ratchet check will skip gracefully."
          fi
        fi

    - id: run-gate
      shell: bash
      env:
        CLI_PATH: ${{ steps.setup-cli.outputs.cli-path }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_WORKING_TREE: ${{ inputs.working-tree }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_RATCHET: ${{ inputs.ratchet }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
        RESOLVED_BASELINE: ${{ steps.prepare-baseline.outputs.resolved-baseline }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_ONLY: ${{ inputs.only }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ADDITIONAL_ARGS: ${{ inputs.additional-args }}
      run: |
        if [ "$INPUT_COMMAND" = "setup" ]; then
          echo "Setup completed successfully."
          echo "exit-code=0" >> "$GITHUB_OUTPUT"
          echo "passed=true" >> "$GITHUB_OUTPUT"
          exit 0
        elif [ "$INPUT_COMMAND" = "baseline-record" ]; then
          CMD_ARGS=("baseline" "record")
          if [ -n "$INPUT_BASELINE_PATH" ]; then
            CMD_ARGS+=("--output" "$INPUT_BASELINE_PATH")
          fi
          if [ -n "$INPUT_PROJECT" ]; then
            CMD_ARGS+=("--project" "$INPUT_PROJECT")
          fi
          if [ -n "$INPUT_CONFIG" ]; then
            CMD_ARGS+=("--config" "$INPUT_CONFIG")
          fi
          if [ "$INPUT_VERBOSE" = "true" ]; then
            CMD_ARGS+=("--verbose")
          fi
          if [ -n "$INPUT_ADDITIONAL_ARGS" ]; then
            eval "EXTRA_ARGS=($INPUT_ADDITIONAL_ARGS)"
            CMD_ARGS+=("${EXTRA_ARGS[@]}")
          fi
        elif [ "$INPUT_COMMAND" = "check" ]; then
          CMD_ARGS=("check")
          if [ "$INPUT_REPOSITORY" = "true" ]; then
            CMD_ARGS+=("--repository")
          elif [ -n "$INPUT_PROJECT" ]; then
            CMD_ARGS+=("--project" "$INPUT_PROJECT")
          elif [ -n "$INPUT_NAMESPACE" ]; then
            CMD_ARGS+=("--namespace" "$INPUT_NAMESPACE")
          elif [ "$INPUT_DIFF" = "true" ]; then
            CMD_ARGS+=("--diff")
          fi

          if [ "$INPUT_WORKING_TREE" = "true" ]; then
            CMD_ARGS+=("--working-tree")
          fi
          if [ -n "$INPUT_BASE" ]; then
            CMD_ARGS+=("--base" "$INPUT_BASE")
          fi
          if [ -n "$INPUT_FORMAT" ]; then
            CMD_ARGS+=("--format" "$INPUT_FORMAT")
          fi
          if [ -n "$INPUT_SKIP" ]; then
            CMD_ARGS+=("--skip" "$INPUT_SKIP")
          fi
          if [ -n "$INPUT_ONLY" ]; then
            CMD_ARGS+=("--only" "$INPUT_ONLY")
          fi
          if [ "$INPUT_FAIL_FAST" = "true" ]; then
            CMD_ARGS+=("--fail-fast")
          fi
          if [ "$INPUT_VERBOSE" = "true" ]; then
            CMD_ARGS+=("--verbose")
          fi
          if [ -n "$INPUT_CONFIG" ]; then
            CMD_ARGS+=("--config" "$INPUT_CONFIG")
          fi
          if [ "$INPUT_RATCHET" = "true" ]; then
            CMD_ARGS+=("--ratchet")
            RESOLVED_BASE="${RESOLVED_BASELINE:-$INPUT_BASELINE_PATH}"
            if [ -n "$RESOLVED_BASE" ] && [ -f "$RESOLVED_BASE" ]; then
              CMD_ARGS+=("--baseline" "$RESOLVED_BASE")
            fi
          fi
          if [ -n "$INPUT_ADDITIONAL_ARGS" ]; then
            eval "EXTRA_ARGS=($INPUT_ADDITIONAL_ARGS)"
            CMD_ARGS+=("${EXTRA_ARGS[@]}")
          fi
        else
          echo "::error::Unknown command '$INPUT_COMMAND'. Expected 'check', 'baseline-record', or 'setup'."
          exit 2
        fi

        echo "Executing: $CLI_PATH ${CMD_ARGS[*]}"
        set +e
        "$CLI_PATH" "${CMD_ARGS[@]}"
        EXIT_CODE=$?
        set -e

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

        LATEST_ARTIFACT_DIR="$(ls -td .qualitygate/artifacts/*/ 2>/dev/null | head -n 1 || true)"
        if [ -n "$LATEST_ARTIFACT_DIR" ] && [ -d "$LATEST_ARTIFACT_DIR" ]; then
          LATEST_ARTIFACT_DIR="${LATEST_ARTIFACT_DIR%/}"
          RUN_ID="$(basename "$LATEST_ARTIFACT_DIR")"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifacts-dir=$LATEST_ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$LATEST_ARTIFACT_DIR/report.json" ]; then
            echo "report-json=$LATEST_ARTIFACT_DIR/report.json" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$LATEST_ARTIFACT_DIR/report.md" ]; then
            echo "report-md=$LATEST_ARTIFACT_DIR/report.md" >> "$GITHUB_OUTPUT"
          fi
        fi

    - id: publish-summary
      if: always()
      shell: bash
      env:
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_COMMAND: ${{ inputs.command }}
        REPORT_MD: ${{ steps.run-gate.outputs.report-md }}
      run: |
        if [ "$INPUT_SUMMARY" != "true" ] || [ "$INPUT_COMMAND" = "setup" ]; then
          exit 0
        fi

        REPORT_FILE="$REPORT_MD"
        if [ -z "$REPORT_FILE" ] || [ ! -f "$REPORT_FILE" ]; then
          REPORT_FILE="$(find .qualitygate/artifacts -name "report.md" 2>/dev/null | sort | tail -n 1 || true)"
        fi

        if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "Published Quality Gate report ($REPORT_FILE) to GITHUB_STEP_SUMMARY."
          else
            echo "GITHUB_STEP_SUMMARY not defined; summary skipped."
          fi
        else
          echo "No report.md found to publish to GITHUB_STEP_SUMMARY."
        fi

    - id: enforce-result
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run-gate.outputs.exit-code }}
      run: |
        if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" -ne 0 ]; then
          echo "::error::Quality Gate failed with exit code $EXIT_CODE"
          exit "$EXIT_CODE"
        fi
