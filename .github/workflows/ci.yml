name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'QualityGate.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore QualityGate.sln

      - name: Build solution
        run: dotnet build QualityGate.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test QualityGate.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

  test-composite-action:
    name: Test Composite Action
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build local CLI executable
        run: |
          dotnet publish src/QualityGate/QualityGate.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -o ./publish

      - name: Test Quality Gate Composite Action
        uses: ./
        with:
          qualitygate-path: ./publish/qualitygate
          diff: 'true'
          only: 'build'
          summary: 'true'

      - name: Test Action Setup Mode
        uses: ./
        with:
          command: 'setup'
          version: 'latest'
